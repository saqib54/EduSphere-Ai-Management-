<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6ef7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Book Base / Pages -->
  <path d="M 140 330 C 180 300 236 300 256 312 C 276 300 332 300 372 330 L 372 200 C 332 170 276 170 256 182 C 236 170 180 170 140 200 Z" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 256 182 L 256 312" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>

  <!-- Graduation Cap Top Accent -->
  <path d="M 256 110 L 360 160 L 256 210 L 152 160 Z" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  
  <!-- Cap Tassel -->
  <circle cx="256" cy="160" r="10" fill="#ffffff"/>
  <path d="M 340 170 L 350 220" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round"/>
</svg>
